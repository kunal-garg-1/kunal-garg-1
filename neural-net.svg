<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Dark theme background */
      .bg { fill: #0d1117; }
      
      /* Nodes */
      .node { fill: #161b22; stroke: #30363d; stroke-width: 3; }
      .node-glow { fill: #58a6ff; opacity: 0; animation: pulseNode 2s infinite; }
      
      /* Connections */
      .link { stroke: #30363d; stroke-width: 2; fill: none; }
      
      /* Flowing data animation */
      .flow { 
        stroke: #58a6ff; 
        stroke-width: 2.5; 
        fill: none;
        stroke-dasharray: 10 30;
        animation: flowData 1.5s linear infinite;
      }

      @keyframes flowData {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      
      @keyframes pulseNode {
        0% { opacity: 0; r: 12; }
        50% { opacity: 0.6; r: 15; }
        100% { opacity: 0; r: 12; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="15"/>

  <g class="link">
    <path d="M 100 100 L 300 70" />
    <path d="M 100 100 L 300 150" />
    <path d="M 100 100 L 300 230" />
    
    <path d="M 100 200 L 300 70" />
    <path d="M 100 200 L 300 150" />
    <path d="M 100 200 L 300 230" />

    <path d="M 300 70 L 500 150" />
    <path d="M 300 150 L 500 150" />
    <path d="M 300 230 L 500 150" />
  </g>

  <g class="flow">
    <path d="M 100 100 L 300 70" />
    <path d="M 100 100 L 300 150" />
    <path d="M 100 200 L 300 150" />
    <path d="M 100 200 L 300 230" />

    <path d="M 300 70 L 500 150" />
    <path d="M 300 150 L 500 150" style="animation-delay: 0.5s;"/>
    <path d="M 300 230 L 500 150" />
  </g>

  <g>
    <circle cx="100" cy="100" r="12" class="node" />
    <circle cx="100" cy="100" r="12" class="node-glow" style="animation-delay: 0s;" />
    
    <circle cx="100" cy="200" r="12" class="node" />
    <circle cx="100" cy="200" r="12" class="node-glow" style="animation-delay: 0.2s;" />

    <circle cx="300" cy="70" r="12" class="node" />
    <circle cx="300" cy="70" r="12" class="node-glow" style="animation-delay: 0.8s;" />
    
    <circle cx="300" cy="150" r="12" class="node" />
    <circle cx="300" cy="150" r="12" class="node-glow" style="animation-delay: 1s;" />
    
    <circle cx="300" cy="230" r="12" class="node" />
    <circle cx="300" cy="230" r="12" class="node-glow" style="animation-delay: 1.2s;" />

    <circle cx="500" cy="150" r="15" class="node" />
    <circle cx="500" cy="150" r="15" class="node-glow" style="animation-delay: 1.5s;" />
  </g>
</svg>
